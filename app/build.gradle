plugins {
    id 'com.android.application'
}

def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
def ksFile = System.getenv('KS_FILE')
// MM_VARIANT=wajha2 builds "واجهة 2": a side-by-side test copy (own package, own data, own update channel).
// Unset = the production app, unchanged.
def wajha2 = System.getenv('MM_VARIANT') == 'wajha2'
// MM_VARIANT=car builds the Android car head-unit edition (own package, own data, own update channel `car-test`).
def car = System.getenv('MM_VARIANT') == 'car'
// exam screen source: web/index.html in this public repo (served raw by GitHub). WEB_URL can override (e.g. واجهة 2 test builds).
def webUrl = System.getenv('WEB_URL') ?: 'https://raw.githubusercontent.com/Mostafe16/medicamall-scope/main/web/index.html'

android {
    namespace 'com.medicamall.scope'
    compileSdk 34

    defaultConfig {
        applicationId car ? 'com.medicamall.scope.car' : (wajha2 ? 'com.medicamall.scope.wajha2' : 'com.medicamall.scope')
        minSdk 24
        // car head units: 32-bit MediaTek (e.g. MT6580) – make sure the 32-bit UVC libs are always packed
        if (car) ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        // 33 on purpose: avoids Android 14 receiver-export crashes inside the UVC library
        targetSdk 33
        versionCode runNo
        versionName car ? "car.${runNo}" : (wajha2 ? "wajha2.${runNo}" : "1.0.${runNo}")
        resValue 'string', 'app_name', car ? 'Medica Mall Scope Car' : (wajha2 ? 'Medica Mall Scope واجهة 2' : 'Medica Mall Scope')
        buildConfigField 'String', 'WEB_URL', "\"${webUrl}\""
        buildConfigField 'String', 'RELEASE_TAG', car ? '"car-test"' : (wajha2 ? '"wajha-2"' : '"app"')
        buildConfigField 'String', 'APK_NAME', car ? '"MedicaMall-Scope-Car.apk"' : (wajha2 ? '"MedicaMall-Scope-Wajha2.apk"' : '"MedicaMall-Scope.apk"')
        buildConfigField 'boolean', 'CAR', car ? 'true' : 'false'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('KS_PASS')
                keyAlias 'medicamall'
                keyPassword System.getenv('KS_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // align kotlin-stdlib-jdk7/jdk8 pulled in by libraries (avoids duplicate classes)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'com.herohan:UVCAndroid:1.0.13'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.core:core:1.12.0'
}
