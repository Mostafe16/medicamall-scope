name: Inspect UVC library API (dev helper)
on:
  workflow_dispatch:
  push:
    branches: [test/car-screen]
    paths: ['.github/workflows/inspect-uvc.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Resolve deps
        run: gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon -q | grep -i uvc || true
      - name: javap
        run: |
          exec > >(tee /tmp/uvc-api.txt) 2>&1
          mkdir -p /tmp/aar; cd /tmp/aar
          for u in https://repo1.maven.org/maven2/com/herohan/UVCAndroid/1.0.13/UVCAndroid-1.0.13.aar https://jitpack.io/com/herohan/UVCAndroid/1.0.13/UVCAndroid-1.0.13.aar; do curl -fsSL -o uvc.aar "$u" && echo "got $u" && break; done
          ls -la /tmp/aar
          for aar in /tmp/aar/uvc.aar; do
            echo "== $aar"; d=$(mktemp -d); unzip -q -o "$aar" -d $d
            jar tf $d/classes.jar | grep -E '^com/(herohan|serenegiant)/.*\.class$' | grep -v '\$' > $d/list.txt
            for c in com/herohan/uvcapp/VideoCaptureConfig com/herohan/uvcapp/CameraPreviewConfig com/serenegiant/usb/IFrameCallback; do
              javap -cp $d/classes.jar -public ${c//\//.} 2>/dev/null || true
            done
            for c in 'com.herohan.uvcapp.VideoCaptureConfig$Builder' 'com.herohan.uvcapp.CameraPreviewConfig$Builder'; do javap -cp $d/classes.jar -public "$c" 2>/dev/null || true; done
            for c in 'x' 'com.herohan.uvcapp.VideoCapture$OutputFileOptions$Builder' 'com.herohan.uvcapp.ImageCapture$OnImageCaptureCallback' 'com.herohan.uvcapp.VideoCapture$OnVideoCaptureCallback' 'com.herohan.uvcapp.ImageCapture$OutputFileResults' 'com.herohan.uvcapp.VideoCapture$OutputFileResults'; do javap -cp $d/classes.jar -public "$c" 2>/dev/null || true; done
          done
      - name: Publish output as annotations
        if: always()
        run: |
          python3 - <<'PY'
          t=open('/tmp/uvc-api.txt',errors='replace').read()
          t=t.replace('%','%25').replace('\r','').replace('\n','%0A')
          parts=[t[k:k+3900] for k in range(0,len(t),3900)]
          kinds=['notice']*10+['warning']*10+['error']*10
          for i,(kind,p) in enumerate(zip(kinds,parts)):
              print('::'+kind+' title=uvc%02d::'%i+p)
          PY
