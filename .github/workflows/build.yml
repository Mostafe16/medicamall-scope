      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pull latest exam screen from medicamall.com
        run: python3 tools/prepare_web.py

      - name: Build APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > /tmp/release.jks; export KS_FILE=/tmp/release.jks; else echo "::warning::Signing secrets missing - test build only, download link NOT updated"; fi
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MedicaMall-Scope.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MedicaMall-Scope
          path: MedicaMall-Scope.apk

      - name: Publish download link
        if: ${{ env.HAS_KEY == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view app >/dev/null 2>&1; then
            gh release upload app MedicaMall-Scope.apk --clobber
          else
            gh release create app MedicaMall-Scope.apk --title "Medica Mall Scope (Android)" --notes "Medica Mall exam-screen app for the Besdata RL-BS010 scope"
          fi
