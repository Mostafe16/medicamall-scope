name: Build WiFi Test APK

on:
  push:
    branches: [test/wifi-view]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wifi-test-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Get previous production APK as web-screen fallback
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download app -p MedicaMall-Scope.apk -O /tmp/prev.apk || true

      - name: Pull latest exam screen
        run: python3 tools/prepare_web.py

      - name: Build side-by-side Wi-Fi test APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > /tmp/release.jks
            export KS_FILE=/tmp/release.jks
          else
            echo "::warning::Release signing secret unavailable; test APK will use debug signing."
          fi
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MedicaMall-Scope-WiFi-Test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MedicaMall-Scope-WiFi-Test
          path: MedicaMall-Scope-WiFi-Test.apk

      - name: Publish isolated pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view wifi-test >/dev/null 2>&1; then
            gh release upload wifi-test MedicaMall-Scope-WiFi-Test.apk --clobber
          else
            gh release create wifi-test MedicaMall-Scope-WiFi-Test.apk \
              --title "Medica Mall Scope - WiFi Test" \
              --notes "Side-by-side Android test build with local Wi-Fi live viewing on port 8080. Production app is unchanged." \
              --prerelease
          fi
